name: Boot Test

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  test-boot:
    name: Test Boot on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest # arm64
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libxdo-dev patchelf xvfb

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build Assets
        run: npm run build

      # The .app on macOS; just the executable elsewhere.
      - name: Build Application
        shell: bash
        run: |
          skip='{"build":{"beforeBuildCommand":""}}'
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx tauri build --bundles app --config "$skip"
          else
            npx tauri build --no-bundle --config "$skip"
          fi

      # Starts the app with --smoke-test (see e2e/boot.spec.ts).
      - name: Run Boot Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test e2e/boot.spec.ts
          else
            npx playwright test e2e/boot.spec.ts
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
