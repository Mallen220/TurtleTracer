[package]
# The app's version comes from package.json (see tauri.conf.json);
# scripts/bump-version.js keeps this one the same.
name = "turtle-tracer"
version = "2.6.0"
description = "A better alternative to the Pedro Pathing Visualizer"
authors = ["Matthew Allen <FTCTurtleTracer@gmail.com>"]
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "turtle_tracer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "process"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.27"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
rusty-leveldb = "3"
dirs = "6"
regex = "1"
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
